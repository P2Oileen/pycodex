name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest-core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group test

      - name: Check core test environment
        run: |
          uv run --group test python - <<'PY'
          from importlib.util import find_spec
          for name in ("workspace_server", "pycodex_ws", "lark_oapi", "IPython"):
              assert find_spec(name) is None, name
          PY

      - name: Run core tests
        run: uv run --group test pytest tests

  pytest-core-py36:
    name: core (Python 3.6)
    runs-on: ubuntu-22.04
    container:
      image: python:3.6.15-slim-bullseye
    steps:
      - name: Install system dependencies
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] https://archive.debian.org/debian bullseye main' \
            > /etc/apt/sources.list
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends git nodejs npm

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$PWD"

      - name: Show runtime versions
        run: |
          python --version
          pip --version
          git --version
          node --version

      - name: Install Python 3.6 compatibility dependencies
        run: |
          python -m pip install -i https://pypi.org/simple \
            "dataclasses>=0.8" \
            "typing_extensions>=4.1.1,<4.2" \
            "importlib_metadata>=4.8.3,<5" \
            "tomli>=1.2.3,<2" \
            "requests>=2.27.1" \
            "prompt-toolkit>=3.0.36,<3.1" \
            "pyyaml>=6.0" \
            "loguru>=0.7.3,<1" \
            "pycryptodomex>=3.20" \
            "pillow>=8.4.0,<9" \
            "starlette>=0.19.1,<0.20" \
            "uvicorn>=0.16,<0.17" \
            "pytest>=6.2.5,<7" \
            "pytest-asyncio>=0.16,<0.17"

      - name: Check core test environment
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          for name in ("workspace_server", "pycodex_ws", "lark_oapi", "IPython"):
              assert find_spec(name) is None, name
          PY

      - name: Run Python 3.6 core tests
        run: PYTHONPATH="$PWD" python -m pytest -c /dev/null tests

  pytest-workspace:
    name: workspace (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run workspace and integration tests
        run: uv run --dev pytest packages/pycodex-ws/tests
