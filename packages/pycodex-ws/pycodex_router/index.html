<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspaces · pycodex</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #fff;
      --soft: #f1f3f7;
      --ink: #202632;
      --muted: #687383;
      --line: #e1e6ed;
      --accent: #385bc7;
      --green: #26734f;
      --green-soft: #eaf5ee;
      --danger: #b54739;
      --unread-bg: #fff7f4;
      --unread-line: #ead0c8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --panel: #1a212b;
        --soft: #232d3a;
        --ink: #edf1f7;
        --muted: #a1adbd;
        --line: #303c4d;
        --accent: #a0b8ff;
        --green: #8ad5ad;
        --green-soft: #233b31;
        --danger: #ffa396;
        --unread-bg: #2b2221;
        --unread-line: #62433d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-size: 13px; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible, .workspace-group-heading:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 3px; }
    svg { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    h1, h2, h3, h4, p { margin: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .page { width: min(1440px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 10px; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--panel); }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -.4px; }
    .brand-context { margin-left: 4px; padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .connection-dot, .online-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--muted); }
    .connection[data-state="live"] .connection-dot, .online-dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .connection[data-state="error"] { color: var(--danger); }
    .connection[data-state="error"] .connection-dot { background: var(--danger); }
    .intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; padding: 24px 0; }
    h1 { font-size: 24px; line-height: 1.3; font-weight: 650; letter-spacing: -.7px; }
    .intro p { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .registration { max-width: 640px; margin-bottom: 24px; }
    .registration summary { width: fit-content; color: var(--accent); cursor: pointer; }
    .registration-content { display: grid; gap: 8px; margin-top: 12px; }
    .registration input { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .registration p { color: var(--muted); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    #alias-status, #order-status { margin-bottom: 12px; color: var(--danger); font-size: 12px; }
    #alias-status:empty, #order-status:empty { display: none; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
    .layout > * { min-width: 0; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h2 { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
    .count { min-width: 23px; padding: 2px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
    #activity { color: var(--green); font-size: 12px; }
    #workspaces { display: grid; gap: 16px; }
    .workspace-table, .nodes { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
    .workspace-group-heading { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
    .workspace-group-heading::-webkit-details-marker { display: none; }
    .disclosure-icon { width: 14px; height: 14px; color: var(--muted); }
    .workspace-group[open] .disclosure-icon { transform: rotate(90deg); }
    .workspace-group-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; line-height: 1.6; overflow-wrap: anywhere; }
    .workspace-group-heading .count { flex: 0 0 auto; }
    .list-head, .workspace-row { display: grid; grid-template-columns: minmax(94px, .85fr) minmax(120px, 1.85fr) 76px 44px; gap: 12px; align-items: center; padding: 10px 14px; }
    .list-head { position: sticky; top: 0; z-index: 1; background: var(--soft); color: var(--muted); font-size: 10px; font-weight: 550; letter-spacing: .3px; }
    .workspace-row { position: relative; min-height: 62px; border-top: 1px solid var(--line); }
    .workspace-row > * { min-width: 0; }
    .workspace-row:hover { background: var(--soft); }
    .workspace-row:last-child { border-radius: 0 0 9px 9px; }
    #unread-workspaces { background: var(--unread-bg); border-color: var(--unread-line); border-left: 3px solid var(--danger); }
    .unread-heading { display: flex; align-items: center; gap: 9px; padding: 14px; color: var(--danger); }
    .unread-heading svg { width: 17px; height: 17px; }
    .unread-heading h3 { flex: 1; font-size: 13px; font-weight: 600; }
    .unread-heading .count { color: var(--panel); background: var(--danger); }
    #unread-workspaces .workspace-row { border-color: var(--unread-line); }
    #unread-workspaces .workspace-row:hover { background: var(--panel); }
    .activity-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 4px; color: var(--muted); background: var(--soft); font-size: 10px; font-weight: 500; }
    .activity-badge[hidden] { display: none; }
    .workspace-group-name .device-working { margin-left: 8px; white-space: nowrap; }
    .activity-badge[data-state="working"] { color: var(--green); background: var(--green-soft); }
    .activity-badge[data-state="working"]::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: spinner-pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes spinner-pulse {
      0%, 100% { opacity: .45; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .activity-badge[data-state="working"]::before { animation: none; opacity: .8; transform: none; }
    }
    .workspace-status { display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
    .unread-dot { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
    .workspace-title { font-size: 12px; line-height: 1.6; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .workspace-path, .state-path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .state-path { color: var(--muted); }
    .session-count { display: block; color: var(--muted); font-size: 11px; line-height: 1.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .open-link, .manage-link { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; min-height: 28px; color: var(--accent); font-size: 11px; font-weight: 550; white-space: nowrap; }
    .open-link svg, .manage-link svg { width: 13px; height: 13px; }
    .open-link::after { content: ""; position: absolute; inset: 0; }
    .open-link:hover, .manage-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    .device { min-width: 0; padding: 12px 14px; }
    .device + .device { border-top: 1px solid var(--line); }
    .device-heading { display: flex; align-items: start; gap: 9px; }
    .device-heading svg { width: 17px; height: 17px; margin-top: 1px; color: var(--muted); }
    .device-name { flex: 1; min-width: 0; font-size: 11px; font-weight: 500; line-height: 1.6; overflow-wrap: anywhere; }
    .device-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .device-rename, .device-drag, .device-alias-actions button { display: inline-flex; align-items: center; justify-content: center; min-height: 28px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); font: inherit; cursor: pointer; }
    .device-rename:hover, .device-drag:hover, .device-alias-actions button:hover { background: var(--soft); color: var(--ink); }
    .device-rename, .device-drag { flex: 0 0 28px; padding: 4px; border-color: transparent; }
    .device-rename[hidden] { display: none; }
    .device-rename svg, .device-drag svg { width: 14px; height: 14px; margin: 0; color: inherit; }
    .device-drag { touch-action: none; user-select: none; cursor: grab; }
    .device-drag:disabled { opacity: .35; cursor: default; }
    .device[data-dragging] { background: var(--soft); opacity: .65; }
    .device-drop-before { box-shadow: 0 -2px var(--accent); }
    .nodes.device-drop-end { box-shadow: inset 0 -2px var(--accent); }
    .device-alias-input { width: 100%; min-width: 0; padding: 3px 6px; border: 1px solid var(--accent); border-radius: 4px; background: var(--panel); color: var(--ink); font: inherit; outline: none; }
    .device-alias-actions { display: flex; gap: 6px; margin-top: 6px; }
    .online-dot { margin-top: 7px; }
    .device-heading > .unread-dot { margin-top: 7px; }
    .device-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 8px; margin-top: 6px; }
    .device-detail { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .empty { grid-column: 1 / -1; display: grid; justify-items: center; gap: 8px; padding: 32px 20px; text-align: center; }
    .empty svg { width: 24px; height: 24px; margin-bottom: 4px; color: var(--muted); }
    .empty h3 { font-size: 13px; font-weight: 550; }
    .empty p { max-width: 290px; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .layout[data-stale="true"] .workspace-table, .layout[data-stale="true"] .nodes { opacity: .6; }
    @media (max-width: 1000px) {
      .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    }
    @media (max-width: 700px) {
      .page { width: calc(100% - 28px); }
      .topbar { gap: 16px; padding: 14px 0; }
      .brand-context { display: none; }
      .connection { max-width: 160px; font-size: 11px; }
      .intro { padding: 20px 0; }
      .list-head { display: none; }
      .workspace-row { grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 10px; padding: 10px 12px; }
      .workspace-paths { grid-column: 1 / -1; grid-row: 2; }
      .workspace-status { grid-column: 2; grid-row: 1; }
      .open-link { grid-column: 3; grid-row: 1; min-height: 36px; }
      .device-rename, .device-drag, .device-alias-actions button { min-height: 36px; }
      .device-rename, .device-drag { flex-basis: 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="pycodex workspaces">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 6 6-6 6m9 0h5"/></svg></span>
        <span class="brand-name">pycodex</span>
        <span class="brand-context">router</span>
      </a>
      <div id="status" class="connection" role="status" data-state="connecting">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </header>
    <main>
      <div class="intro">
        <h1>Your workspaces</h1>
        <p>Across your connected devices.</p>
      </div>
      <details id="device-connection" class="registration">
        <summary>Connect a trusted device</summary>
        <div class="registration-content">
          <label for="registration-key">Registration key</label>
          <input id="registration-key" readonly autocomplete="off" spellcheck="false">
          <p id="registration-status" role="status"></p>
          <p>On the device, use <code>pycodex-ws --listen-to KEY@ROUTER_ADDRESS:6000</code>. Replace <code>KEY</code> with this key and use your router's device port.</p>
        </div>
      </details>
      <p id="alias-status" role="alert"></p>
      <p id="order-status" role="alert"></p>
      <div class="layout">
        <section aria-labelledby="workspace-heading">
          <div class="section-heading">
            <h2 id="workspace-heading">Workspaces <span id="workspace-count" class="count">—</span></h2>
            <span id="activity"></span>
          </div>
          <div id="workspaces" aria-busy="true">
            <div class="empty"><h3>Loading workspaces…</h3></div>
          </div>
        </section>
        <aside aria-labelledby="device-heading">
          <div class="section-heading">
            <h2 id="device-heading">Online devices <span id="device-count" class="count">—</span></h2>
          </div>
          <div id="nodes" class="nodes" aria-busy="true"></div>
        </aside>
      </div>
    </main>
  </div>
  <template id="unread-template">
    <section id="unread-workspaces" class="workspace-table" aria-labelledby="unread-heading">
      <header class="unread-heading">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg>
        <h3 id="unread-heading">Unread</h3>
        <span class="count"></span>
      </header>
      <div class="workspace-group-list"></div>
    </section>
  </template>
  <template id="workspace-group-template">
    <details class="workspace-table workspace-group">
      <summary class="workspace-group-heading">
        <svg class="disclosure-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        <h3 class="workspace-group-name">
          <span class="device-label"></span>
          <span class="activity-badge device-working" data-state="working" hidden></span>
        </h3>
        <span class="unread-dot device-unread" hidden role="img" aria-label="Unread workspaces" title="Unread workspaces"></span>
        <span class="count"></span>
        <a class="manage-link">Manage <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
      </summary>
      <div class="list-head" aria-hidden="true">
        <span>Workspace</span><span>Directory / state</span><span>Status</span><span></span>
      </div>
      <div class="workspace-group-list"></div>
    </details>
  </template>
  <template id="workspace-template">
    <article class="workspace-row">
      <div class="workspace-main">
        <h4 class="workspace-title"></h4>
        <span class="session-count"></span>
      </div>
      <div class="workspace-paths">
        <p class="workspace-path"></p>
        <p class="state-path"></p>
      </div>
      <span class="workspace-status">
        <span class="unread-dot" role="img" aria-label="Unread reply" title="Unread reply"></span>
        <span class="activity-badge"></span>
      </span>
      <a class="open-link">Open <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
    </article>
  </template>
  <template id="device-template">
    <article class="device">
      <div class="device-heading">
        <button type="button" class="device-drag" title="Drag to reorder, or use the up and down arrow keys">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/></svg>
        </button>
        <h3 class="device-name"><span class="device-label"></span></h3>
        <button type="button" class="device-rename" title="Rename device">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4M4 20l4-1L20 7a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg>
        </button>
        <span class="unread-dot device-unread" hidden role="img" aria-label="Unread workspaces" title="Unread workspaces"></span>
        <span class="online-dot" aria-label="Online"></span>
      </div>
      <div class="device-footer">
        <p class="device-detail"></p>
        <span class="activity-badge device-working" data-state="working" hidden></span>
      </div>
    </article>
  </template>
  <template id="device-alias-template">
    <span class="device-alias-editor">
      <input type="text" class="device-alias-input" minlength="1" maxlength="128" required aria-label="Device alias" title="Use 1 to 128 characters.">
      <span class="device-alias-actions">
        <button type="button" class="device-alias-save">Save</button>
        <button type="button" class="device-alias-cancel">Cancel</button>
      </span>
    </span>
  </template>
  <template id="empty-template">
    <div class="empty">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8m-4-4v4"/></svg>
      <h3></h3>
      <p></p>
    </div>
  </template>
  <script type="module">
    function mountDirectory() {
      const status = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const layout = document.querySelector(".layout");
      const workspaces = document.getElementById("workspaces");
      const nodes = document.getElementById("nodes");
      const unreadTemplate = document.getElementById("unread-template");
      const workspaceGroupTemplate = document.getElementById("workspace-group-template");
      const workspaceTemplate = document.getElementById("workspace-template");
      const deviceTemplate = document.getElementById("device-template");
      const deviceAliasTemplate = document.getElementById("device-alias-template");
      const emptyTemplate = document.getElementById("empty-template");
      const deviceConnection = document.getElementById("device-connection");
      const registrationKey = document.getElementById("registration-key");
      const registrationStatus = document.getElementById("registration-status");
      const aliasStatus = document.getElementById("alias-status");
      const orderStatus = document.getElementById("order-status");
      let refreshing = false;
      let signature = "";
      let editingDevice = null;
      let inventoryRevision = 0;
      let reordering = false;
      let drag = null;

      registrationKey.addEventListener("focus", () => registrationKey.select());
      deviceConnection.addEventListener("toggle", async () => {
        registrationKey.value = "";
        registrationStatus.textContent = "";
        if (!deviceConnection.open) return;
        registrationStatus.textContent = "Loading…";
        try {
          const response = await fetch("api/registration-key", {cache: "no-store"});
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!deviceConnection.open) return;
          registrationKey.value = data.key;
          registrationStatus.textContent = "Select the key to copy it.";
        } catch (error) {
          if (deviceConnection.open) registrationStatus.textContent = `Could not load key · ${error.message}`;
        }
      });

      function countLabel(count, label) {
        return `${count} ${label}${count === 1 ? "" : "s"}`;
      }

      function empty(title, description) {
        const element = emptyTemplate.content.firstElementChild.cloneNode(true);
        element.querySelector("h3").textContent = title;
        element.querySelector("p").textContent = description;
        return element;
      }

      function setStatus(state, message) {
        status.dataset.state = state;
        if (statusText.textContent !== message) statusText.textContent = message;
        layout.dataset.stale = String(state === "error");
      }

      function setDeviceLabel(label, node) {
        label.textContent = node.alias || node.name;
        label.title = node.name;
      }

      function editDeviceAlias(label, button, node, data) {
        if (editingDevice !== null || reordering) return;
        editingDevice = node.id;
        aliasStatus.textContent = "";
        const editor = deviceAliasTemplate.content.firstElementChild.cloneNode(true);
        const input = editor.querySelector("input");
        input.value = node.alias || "";
        input.placeholder = node.name;
        label.hidden = true;
        button.hidden = true;
        label.before(editor);
        let finished = false;
        const finish = async save => {
          if (finished) return;
          finished = true;
          const alias = input.value.trim();
          editor.remove();
          label.hidden = false;
          button.hidden = false;
          try {
            if (save && !alias) throw new Error("Device alias must contain at least one character.");
            if (save && alias !== (node.alias || "")) {
              const response = await fetch(`api/nodes/${encodeURIComponent(node.id)}/alias`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({alias}),
              });
              if (!response.ok) throw new Error(await response.text());
              const result = await response.json();
              node.alias = result.alias;
              inventoryRevision += 1;
              render(data);
              signature = JSON.stringify(data);
            }
          } catch (error) {
            aliasStatus.textContent = `Could not rename device: ${error.message}`;
          } finally {
            editingDevice = null;
            nodes.querySelector(`.device[data-node-id="${CSS.escape(node.id)}"] .device-rename`).focus();
            refresh();
          }
        };
        editor.addEventListener("keydown", event => {
          if (event.isComposing) return;
          if (event.key === "Escape" || (event.key === "Enter" && event.target === input)) {
            event.preventDefault();
            finish(event.key === "Enter");
          }
        });
        editor.querySelector(".device-alias-save").addEventListener("click", () => finish(true));
        editor.querySelector(".device-alias-cancel").addEventListener("click", () => finish(false));
        input.focus();
        input.select();
      }

      async function saveDeviceOrder(data, order, nodeId) {
        reordering = true;
        orderStatus.textContent = "";
        try {
          if (order.some((id, index) => id !== data.nodes[index].id)) {
            const response = await fetch("api/nodes/order", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({order}),
            });
            if (!response.ok) throw new Error(await response.text());
            const result = await response.json();
            const byId = new Map(data.nodes.map(node => [node.id, node]));
            data.nodes = result.order.map(id => byId.get(id));
            data.workspaces = result.order.flatMap(
              id => data.workspaces.filter(workspace => workspace.node_id === id));
            inventoryRevision += 1;
            render(data);
            signature = JSON.stringify(data);
          }
        } catch (error) {
          orderStatus.textContent = `Could not reorder devices: ${error.message}`;
        } finally {
          reordering = false;
          nodes.querySelector(`.device[data-node-id="${CSS.escape(nodeId)}"] .device-drag`).focus({preventScroll: true});
          refresh();
        }
      }

      function clearDropMarker() {
        nodes.classList.remove("device-drop-end");
        for (const card of nodes.querySelectorAll(".device-drop-before")) {
          card.classList.remove("device-drop-before");
        }
      }

      function markDropTarget() {
        clearDropMarker();
        drag.before = Array.from(nodes.children).find(card => {
          const rect = card.getBoundingClientRect();
          return card !== drag.card && drag.y < (rect.top + rect.bottom) / 2;
        });
        (drag.before || nodes).classList.add(drag.before ? "device-drop-before" : "device-drop-end");
      }

      function scrollDrag() {
        const step = drag.y < 56 ? -12 : drag.y > innerHeight - 56 ? 12 : 0;
        if (step) {
          window.scrollBy(0, step);
          markDropTarget();
        }
        drag.frame = requestAnimationFrame(scrollDrag);
      }

      function finishDrag(commit, event) {
        const current = drag;
        if (!current) return;
        drag = null;
        cancelAnimationFrame(current.frame);
        current.card.removeAttribute("data-dragging");
        clearDropMarker();
        if (nodes.hasPointerCapture(current.pointerId)) {
          nodes.releasePointerCapture(current.pointerId);
        }
        const rect = nodes.getBoundingClientRect();
        if (commit && current.moved && event.clientX >= rect.left
            && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom) {
          const cards = Array.from(nodes.children).filter(card => card !== current.card);
          const index = current.before ? cards.indexOf(current.before) : cards.length;
          cards.splice(index, 0, current.card);
          saveDeviceOrder(current.data, cards.map(card => card.dataset.nodeId), current.card.dataset.nodeId);
        } else {
          reordering = false;
          refresh();
        }
      }

      nodes.addEventListener("pointermove", event => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        drag.y = event.clientY;
        if (!drag.moved) {
          if (Math.hypot(event.clientX - drag.x, event.clientY - drag.startY) < 5) return;
          drag.moved = true;
          drag.card.setAttribute("data-dragging", "");
          drag.frame = requestAnimationFrame(scrollDrag);
        }
        markDropTarget();
      });
      nodes.addEventListener("pointerup", event => {
        if (drag && event.pointerId === drag.pointerId) finishDrag(true, event);
      });
      nodes.addEventListener("pointercancel", () => finishDrag(false));
      nodes.addEventListener("lostpointercapture", () => finishDrag(false));
      nodes.addEventListener("keydown", event => {
        if (drag && event.key === "Escape") {
          event.preventDefault();
          finishDrag(false);
        }
      });

      function bindDeviceDrag(card, node, data) {
        const handle = card.querySelector(".device-drag");
        handle.disabled = data.nodes.length < 2;
        handle.setAttribute("aria-label", `Reorder device ${node.alias || node.name}`);
        handle.addEventListener("pointerdown", event => {
          if (event.button !== 0 || reordering || editingDevice !== null) return;
          event.preventDefault();
          handle.focus({preventScroll: true});
          reordering = true;
          orderStatus.textContent = "";
          drag = {card, data, pointerId: event.pointerId, x: event.clientX,
            startY: event.clientY, y: event.clientY, moved: false, frame: null, before: null};
          nodes.setPointerCapture(event.pointerId);
        });
        handle.addEventListener("keydown", event => {
          if (reordering || editingDevice !== null || !["ArrowUp", "ArrowDown"].includes(event.key)) return;
          event.preventDefault();
          const order = data.nodes.map(item => item.id);
          const index = order.indexOf(node.id);
          const target = index + (event.key === "ArrowUp" ? -1 : 1);
          if (target < 0 || target >= order.length) return;
          [order[index], order[target]] = [order[target], order[index]];
          saveDeviceOrder(data, order, node.id);
        });
      }

      function render(data) {
        const focusedHandle = nodes.contains(document.activeElement)
          && document.activeElement.matches(".device-drag")
          ? document.activeElement.closest(".device").dataset.nodeId : null;
        const expanded = new Set(Array.from(
          workspaces.querySelectorAll(".workspace-group[open]"), group => group.dataset.nodeId));
        const workspaceList = document.createDocumentFragment();
        const unreadGroup = unreadTemplate.content.firstElementChild.cloneNode(true);
        const unreadList = unreadGroup.querySelector(".workspace-group-list");
        const groups = new Map();
        for (const node of data.nodes) {
          const group = workspaceGroupTemplate.content.firstElementChild.cloneNode(true);
          group.dataset.nodeId = node.id;
          group.open = expanded.has(node.id);
          group.setAttribute("aria-label", node.alias || node.name);
          setDeviceLabel(group.querySelector(".device-label"), node);
          const link = group.querySelector(".manage-link");
          link.href = node.url;
          link.setAttribute("aria-label", `Manage workspaces on ${node.alias || node.name}`);
          groups.set(node.id, {node, group});
        }
        for (const workspace of data.workspaces) {
          const card = workspaceTemplate.content.firstElementChild.cloneNode(true);
          const title = card.querySelector(".workspace-title");
          title.textContent = workspace.id;
          title.title = workspace.id;
          card.querySelector(".unread-dot").hidden = !workspace.unread;
          const path = card.querySelector(".workspace-path");
          path.textContent = workspace.work_dir;
          path.title = workspace.work_dir;
          const statePath = card.querySelector(".state-path");
          statePath.textContent = workspace.state_path;
          statePath.title = workspace.state_path;
          const activity = card.querySelector(".activity-badge");
          activity.dataset.state = workspace.running ? "working" : "ready";
          activity.textContent = workspace.running ? "Working" : "Ready";
          card.querySelector(".session-count").textContent = countLabel(workspace.session_count, "session");
          const link = card.querySelector(".open-link");
          link.href = workspace.url;
          const {node, group} = groups.get(workspace.node_id);
          link.setAttribute("aria-label", `Open ${workspace.id} on ${node.alias || node.name}`);
          group.querySelector(".workspace-group-list").append(card);
          if (workspace.unread) {
            group.querySelector(".device-unread").hidden = false;
            const unreadCard = card.cloneNode(true);
            const detail = unreadCard.querySelector(".session-count");
            detail.textContent = `${node.alias || node.name} · ${detail.textContent}`;
            detail.title = detail.textContent;
            unreadList.append(unreadCard);
          }
        }
        if (unreadList.childElementCount) {
          unreadGroup.querySelector(".count").textContent = countLabel(
            unreadList.childElementCount, "workspace");
          workspaceList.append(unreadGroup);
        }
        for (const {group} of groups.values()) {
          const count = group.querySelector(".workspace-group-list").childElementCount;
          group.querySelector(".count").textContent = countLabel(count, "workspace");
          if (!count) {
            group.querySelector(".list-head").remove();
            group.querySelector(".workspace-group-list").append(
              empty("No workspaces yet", "Use Manage to create a workspace on this device."));
          }
          workspaceList.append(group);
        }
        if (!data.nodes.length) {
          workspaceList.append(empty("No workspaces yet",
            "Your workspaces will appear when a device connects."));
        }

        const nodeList = document.createDocumentFragment();
        for (const node of data.nodes) {
          const card = deviceTemplate.content.firstElementChild.cloneNode(true);
          card.dataset.nodeId = node.id;
          bindDeviceDrag(card, node, data);
          const label = card.querySelector(".device-label");
          setDeviceLabel(label, node);
          const rename = card.querySelector(".device-rename");
          rename.setAttribute("aria-label", `Rename device ${node.alias || node.name}`);
          rename.addEventListener("click", () => editDeviceAlias(label, rename, node, data));
          const owned = data.workspaces.filter(workspace => workspace.node_id === node.id);
          card.querySelector(".device-unread").hidden = !owned.some(workspace => workspace.unread);
          const sessions = owned.reduce((total, workspace) => total + workspace.session_count, 0);
          card.querySelector(".device-detail").textContent = `${countLabel(owned.length, "workspace")} · ${countLabel(sessions, "session")}`;
          const working = owned.filter(workspace => workspace.running).length;
          for (const container of [groups.get(node.id).group, card]) {
            const badge = container.querySelector(".device-working");
            badge.hidden = !working;
            badge.textContent = working ? `${working} working` : "";
          }
          nodeList.append(card);
        }
        if (!data.nodes.length) {
          nodeList.append(empty("No devices connected", "Connected devices will appear here automatically."));
        }
        workspaces.replaceChildren(workspaceList);
        nodes.replaceChildren(nodeList);
        if (focusedHandle) {
          const handle = nodes.querySelector(`.device[data-node-id="${CSS.escape(focusedHandle)}"] .device-drag`);
          if (handle) handle.focus({preventScroll: true});
        }
        document.getElementById("workspace-count").textContent = data.workspaces.length;
        document.getElementById("device-count").textContent = data.nodes.length;
        const running = data.workspaces.filter(workspace => workspace.running).length;
        document.getElementById("activity").textContent = running ? `${running} working` : "";
      }

      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        const revision = inventoryRevision;
        try {
          const response = await fetch("api/workspaces", {cache: "no-store"});
          if (response.status === 401) {
            window.location.assign("login");
            return;
          }
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const next = JSON.stringify(data);
          if (editingDevice === null && !reordering && revision === inventoryRevision && next !== signature) {
            render(data);
            signature = next;
          }
          statusText.title = "";
          setStatus("live", "Live · updates automatically");
        } catch (error) {
          setStatus("error", "Could not refresh · retrying");
          statusText.title = error.message;
          if (!signature) {
            workspaces.replaceChildren(empty("Unable to load workspaces", "The page will try again automatically."));
            nodes.replaceChildren();
          }
        } finally {
          refreshing = false;
          workspaces.setAttribute("aria-busy", "false");
          nodes.setAttribute("aria-busy", "false");
        }
      }
      refresh();
      setInterval(refresh, 2000);
    }
    mountDirectory();
  </script>
</body>
</html>
