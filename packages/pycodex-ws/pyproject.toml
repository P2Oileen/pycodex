[build-system]
requires = ["hatchling>=1.17.1,<1.18"]
build-backend = "hatchling.build"

[project]
name = "pycodex-ws"
version = "0.3.3"
description = "Browser workspace, Feishu and IPython integrations for python-codex"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "python-codex==0.3.3",
    "lark-oapi",
    "ipython>=7",
    "pillow>=9.0.0",
]

[project.scripts]
pycodex-ws = "workspace_server:main"

[tool.uv.sources]
python-codex = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["workspace_server", "pycodex_ws"]
exclude = ["workspace_server/frontend"]
artifacts = [
    "workspace_server/workspace.html",
    "workspace_server/workspaces.html",
    "workspace_server/content_views.mjs",
    "workspace_server/content_views.css",
    "workspace_server/content_views.LICENSE.txt",
    "workspace_server/editor.mjs",
    "workspace_server/editor.css",
]

[tool.hatch.build.targets.sdist]
only-include = ["workspace_server", "pycodex_ws", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["workspace_server/frontend/node_modules"]
