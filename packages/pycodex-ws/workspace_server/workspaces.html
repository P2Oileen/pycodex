<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspaces · pycodex</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f1f3f7;
      --text: #202632;
      --muted: #687383;
      --line: #e1e6ed;
      --accent: #385bc7;
      --accent-strong: #2c49a6;
      --green: #26734f;
      --green-soft: #eaf5ee;
      --danger: #b42318;
      --danger-soft: #fff0ed;
      --breathing-duration: 1.2s;
      --breathing-ease: cubic-bezier(0.4, 0, 0.2, 1);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --panel: #1a212b;
        --panel-soft: #232d3a;
        --text: #edf1f7;
        --muted: #a1adbd;
        --line: #303c4d;
        --accent: #a0b8ff;
        --accent-strong: #bfd0ff;
        --green: #8ad5ad;
        --green-soft: #233b31;
        --danger: #ff8c7f;
        --danger-soft: #321d1b;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    button, input {
      font: inherit;
    }
    button, a.button {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 10px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--panel);
    }
    button.primary:hover {
      background: var(--accent-strong);
    }
    button.danger {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }
    button.danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }
    button:disabled {
      cursor: default;
      opacity: .62;
    }
    input {
      width: 100%;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 9px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    input::placeholder {
      color: var(--muted);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="checkbox"] {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }
    .page {
      width: min(1440px, calc(100% - 48px));
      margin: 0 auto;
      padding: 16px 0 32px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.4px;
    }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--text); color: var(--panel); }
    svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .brand-context { margin-left: 4px; padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 400; letter-spacing: 0; }
    .intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; padding: 24px 0; }
    .intro h1 { margin: 0; font-size: 24px; line-height: 1.3; font-weight: 650; letter-spacing: -.7px; }
    .intro p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .status {
      min-width: 0;
      max-width: 420px;
      color: var(--muted);
      text-align: right;
      line-height: 1.4;
      font-size: 11px;
    }
    .status.error {
      color: var(--danger);
    }
    .action-status { max-width: none; margin: 0 0 16px; text-align: left; }
    .action-status:empty { display: none; }
    .workspace-list.stale { opacity: .6; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      align-items: start;
    }
    .panel {
      min-width: 0;
    }
    .create-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
      margin-bottom: 12px;
    }
    .create-panel .panel-head { padding: 14px 14px 0; margin-bottom: 0; }
    .list-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .count { min-width: 23px; padding: 2px 7px; border-radius: 6px; background: var(--panel-soft); color: var(--muted); font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
    .panel-title {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
    }
    .panel-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }
    form {
      display: grid;
      gap: 12px;
      padding: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
    }
    .field-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .field-label span { color: var(--muted); font-size: 11px; font-weight: 400; }
    .form-actions {
      display: flex;
      gap: 9px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 2px;
    }
    .form-actions button { width: 100%; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .metric {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .metric-value {
      display: block;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.1;
    }
    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .workspace-table { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
    .list-head, .workspace-row {
      display: grid;
      grid-template-columns: minmax(100px, .8fr) minmax(160px, 1.8fr) 112px;
      gap: 14px;
      align-items: center;
      padding: 10px 14px;
    }
    .list-head { position: sticky; top: 0; z-index: 1; border-radius: 9px 9px 0 0; background: var(--panel-soft); color: var(--muted); font-size: 10px; font-weight: 550; letter-spacing: .3px; }
    .list-head span:last-child { text-align: right; }
    .workspace-row { position: relative; min-height: 62px; border-top: 1px solid var(--line); }
    .workspace-row:hover { background: var(--panel-soft); }
    .workspace-row:last-child { border-radius: 0 0 9px 9px; }
    .workspace-name {
      min-width: 0;
    }
    .workspace-status { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; vertical-align: middle; }
    .unread-dot { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
    .workspace-name strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
    }
    .session-count {
      display: inline-flex;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .activity-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 4px; color: var(--muted); background: var(--panel-soft); font-size: 10px; font-weight: 500; }
    .activity-badge[data-state="working"] { color: var(--green); background: var(--green-soft); }
    .activity-badge[data-state="working"]::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: spinner-pulse var(--breathing-duration) var(--breathing-ease) infinite; }
    @keyframes spinner-pulse {
      0%, 100% { opacity: .45; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .activity-badge[data-state="working"]::before { animation: none; opacity: .8; transform: none; }
    }
    .paths {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .path-line {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 8px;
      align-items: baseline;
      min-width: 0;
    }
    .path-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }
    .path-value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }
    .actions a.button { color: var(--accent); border-color: var(--line); }
    .actions a.button:hover { background: var(--panel-soft); }
    .actions a.button::after { content: ""; position: absolute; inset: 0; }
    .actions button { position: relative; z-index: 1; }
    .empty {
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 36px 18px;
      color: var(--muted);
      text-align: center;
    }
    .empty strong {
      color: var(--text);
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .create-panel { max-width: 440px; width: 100%; }
    }
    @media (max-width: 700px) {
      .page { width: calc(100% - 28px); padding-top: 14px; }
      .brand-context { display: none; }
      .intro { padding: 20px 0; }
      .list-heading { gap: 6px 8px; }
      .summary { gap: 8px; }
      .list-head { display: none; }
      .workspace-row { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 12px; }
      .workspace-row:first-child { border-top: 0; border-radius: 9px 9px 0 0; }
      .paths { grid-column: 1 / -1; grid-row: 2; }
      .actions { grid-column: 2; grid-row: 1; }
      .actions button, .actions .button { min-height: 36px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 6 6-6 6m9 0h5"/></svg></span>
        <span>pycodex</span>
        <span class="brand-context">workspaces</span>
      </a>
      <div id="status" class="status" role="status">Connecting…</div>
    </header>
    <div class="intro">
      <h1>Your workspaces</h1>
      <p>Manage workspaces on this device.</p>
    </div>
    <p id="actionStatus" class="status action-status" role="status"></p>
    <div class="layout">
      <section class="panel" aria-labelledby="listTitle">
        <div class="panel-head">
          <div class="list-heading">
            <h2 id="listTitle" class="panel-title">Workspaces</h2>
            <span id="workspaceCount" class="count">0</span>
            <div class="summary" aria-label="Workspace summary">
              <div class="metric">
                <span id="sessionCount" class="metric-value">0</span>
                <span class="metric-label">sessions</span>
              </div>
              <div class="metric">
                <span id="activeCount" class="metric-value">0</span>
                <span class="metric-label">working</span>
              </div>
            </div>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div class="workspace-table">
          <div class="list-head" aria-hidden="true">
            <span>Workspace</span><span>Paths</span><span>Actions</span>
          </div>
          <div id="workspaceRows" class="workspace-list"></div>
        </div>
      </section>
      <section class="panel create-panel" aria-labelledby="addTitle">
        <div class="panel-head">
          <div>
            <h2 id="addTitle" class="panel-title">New workspace</h2>
            <p class="panel-subtitle">Create a workspace on this device.</p>
          </div>
        </div>
        <form id="workspaceForm">
          <label>Directory
            <input id="dirInput" name="dir" placeholder="./" spellcheck="false">
          </label>
          <label>
            <span class="field-label">Name <span>optional</span></span>
            <input id="nameInput" name="name" autocomplete="off" placeholder="workspace-1" spellcheck="false">
          </label>
          <label>
            <span class="field-label">State file prefix <span>optional</span></span>
            <input id="statePathInput" name="state_path" placeholder="/tmp/pcws-xxxx" spellcheck="false">
          </label>
          <label class="checkbox-label">
            <input id="enableBoardInput" name="enable_board" type="checkbox" checked>
            Enable Canvas
          </label>
          <div class="form-actions">
            <button id="addButton" class="primary" type="submit">Create workspace</button>
          </div>
        </form>
      </section>

    </div>
  </main>

  <script type="module">
    const rows = document.getElementById("workspaceRows");
    const form = document.getElementById("workspaceForm");
    const statusEl = document.getElementById("status");
    const actionStatus = document.getElementById("actionStatus");
    const nameInput = document.getElementById("nameInput");
    const dirInput = document.getElementById("dirInput");
    const statePathInput = document.getElementById("statePathInput");
    const enableBoardInput = document.getElementById("enableBoardInput");
    const addButton = document.getElementById("addButton");
    const refreshButton = document.getElementById("refreshButton");
    const workspaceCount = document.getElementById("workspaceCount");
    const sessionCount = document.getElementById("sessionCount");
    const activeCount = document.getElementById("activeCount");

    function api(path) {
      return new URL(path, window.location.href).toString();
    }

    function setStatus(text, isError = false) {
      actionStatus.textContent = text || "";
      actionStatus.classList.toggle("error", Boolean(isError));
    }

    function textNode(tag, className, text) {
      const node = document.createElement(tag);
      node.className = className;
      node.textContent = text || "";
      return node;
    }

    function pathLine(label, value) {
      const row = document.createElement("div");
      row.className = "path-line";
      row.appendChild(textNode("span", "path-label", label));
      const path = textNode("span", "path-value", value || "");
      path.title = value || "";
      row.appendChild(path);
      return row;
    }

    function renderSummary(workspaces) {
      const sessions = [];
      workspaces.forEach((workspace) => {
        (workspace.sessions || []).forEach((session) => sessions.push(session));
      });
      workspaceCount.textContent = String(workspaces.length);
      sessionCount.textContent = String(sessions.length);
      activeCount.textContent = String(workspaces.filter(
        workspace => workspace.sessions.some(session => session.running)
      ).length);
    }

    function renderEmpty() {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.appendChild(textNode("strong", "", "No workspaces yet"));
      empty.appendChild(textNode("span", "", "Add one to start a pycodex session."));
      rows.appendChild(empty);
    }

    function renderWorkspace(workspace) {
      const row = document.createElement("article");
      row.className = "workspace-row";
      row.dataset.workspaceId = workspace.id;

      const name = document.createElement("div");
      name.className = "workspace-name";
      const title = textNode("strong", "", workspace.id || "");
      title.title = workspace.id || "";
      name.appendChild(title);
      const sessions = Array.isArray(workspace.sessions) ? workspace.sessions : [];
      name.appendChild(textNode("span", "session-count", `${sessions.length} session${sessions.length === 1 ? "" : "s"}`));
      const status = textNode("span", "workspace-status", "");
      const unread = textNode("span", "unread-dot", "");
      unread.title = "Unread reply";
      unread.setAttribute("role", "img");
      unread.setAttribute("aria-label", "Unread reply");
      status.appendChild(unread);
      status.appendChild(textNode("span", "activity-badge", ""));
      name.appendChild(status);

      const paths = document.createElement("div");
      paths.className = "paths";
      paths.appendChild(pathLine("Dir", workspace.work_dir || ""));
      paths.appendChild(pathLine("State", workspace.state_path));

      const actions = document.createElement("div");
      actions.className = "actions";
      const open = document.createElement("a");
      open.className = "button";
      open.href = `w/${encodeURIComponent(workspace.id || "")}/`;
      open.textContent = "Open";
      const remove = document.createElement("button");
      remove.className = "danger";
      remove.type = "button";
      remove.textContent = "Delete";
      remove.addEventListener("click", () => deleteWorkspace(workspace.id || ""));
      actions.appendChild(open);
      actions.appendChild(remove);

      row.appendChild(name);
      row.appendChild(paths);
      row.appendChild(actions);
      rows.appendChild(row);
      return row;
    }

    function render(workspaces) {
      const existing = new Map(
        Array.from(rows.querySelectorAll(".workspace-row"), row => [row.dataset.workspaceId, row])
      );
      renderSummary(workspaces);
      if (!workspaces.length) {
        rows.textContent = "";
        renderEmpty();
        return;
      }
      const empty = rows.querySelector(".empty");
      if (empty) empty.remove();
      workspaces.forEach((workspace, index) => {
        const row = existing.get(workspace.id) || renderWorkspace(workspace);
        existing.delete(workspace.id);
        const count = workspace.sessions.length;
        row.querySelector(".session-count").textContent = `${count} session${count === 1 ? "" : "s"}`;
        const running = workspace.sessions.some(session => session.running);
        const activity = row.querySelector(".activity-badge");
        activity.dataset.state = running ? "working" : "ready";
        activity.textContent = running ? "Working" : "Ready";
        row.querySelector(".unread-dot").hidden = !workspace.sessions.some(session => session.unread);
        if (rows.children[index] !== row) rows.insertBefore(row, rows.children[index] || null);
      });
      existing.forEach(row => row.remove());
    }

    document.addEventListener("animationstart", event => {
      if (event.animationName !== "spinner-pulse") return;
      // Include pseudo-elements and anchor new indicators to the page's breathing phase.
      for (const animation of event.target.getAnimations({subtree: true})) {
        if (animation.animationName === event.animationName) animation.startTime = 0;
      }
    });

    const refresh = (() => {
      let refreshing = false;
      return async () => {
        if (refreshing) return;
        refreshing = true;
        try {
          const response = await fetch(api("api/workspaces"), {cache: "no-store"});
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
          render(payload.workspaces);
          statusEl.textContent = "Live · updates automatically";
          statusEl.title = "";
          statusEl.classList.remove("error");
          rows.classList.remove("stale");
        } catch (error) {
          statusEl.textContent = "Could not refresh · retrying";
          statusEl.title = error.message;
          statusEl.classList.add("error");
          rows.classList.add("stale");
        } finally {
          refreshing = false;
        }
      };
    })();

    async function addWorkspace(event) {
      event.preventDefault();
      setStatus("");
      addButton.disabled = true;
      const response = await fetch(api("api/workspaces"), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name: nameInput.value.trim(),
          dir: dirInput.value.trim() || "./",
          state_path: statePathInput.value.trim() || null,
          enable_board: enableBoardInput.checked,
        }),
      });
      const payload = await response.json();
      addButton.disabled = false;
      if (!response.ok || !payload.ok) {
        setStatus(payload.error || `HTTP ${response.status}`, true);
        return;
      }
      nameInput.value = "";
      dirInput.value = "";
      statePathInput.value = "";
      enableBoardInput.checked = true;
      render(payload.workspaces || []);
      setStatus(`Added ${(payload.workspace && payload.workspace.id) || "workspace"}.`);
    }

    async function deleteWorkspace(name) {
      if (!name) return;
      setStatus("");
      const response = await fetch(api(`api/workspaces/${encodeURIComponent(name)}`), {
        method: "DELETE",
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        setStatus(payload.error || `HTTP ${response.status}`, true);
        return;
      }
      render(payload.workspaces || []);
      setStatus(`Deleted ${name}.`);
    }

    form.addEventListener("submit", addWorkspace);
    refreshButton.addEventListener("click", refresh);
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
