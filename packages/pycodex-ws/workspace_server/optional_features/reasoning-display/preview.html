<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorded reasoning example</title>
<link rel="stylesheet" href="source/custom.css">
<style>
  body { font: 15px/1.6 system-ui; color: #17313b; background: #edf3f5; margin: 0; padding: 24px; }
  main { max-width: 660px; margin: 32px auto; }
  .composer { padding: 16px; background: white; border: 1px solid #cbd5df; border-radius: 12px; min-width: 0; }
  textarea { box-sizing: border-box; width: 100%; margin-top: 12px; padding: 12px; border: 1px solid #cbd5df; border-radius: 8px; }
</style>
<main>
  <h1>Recorded reasoning</h1>
  <p>Synthetic preview · readable summaries and text supplied by the model.</p>
  <section class="composer"><textarea aria-label="Composer">My existing draft</textarea></section>
  <p id="verification" role="status">Preview data stays in this page.</p>
</main>
<script type="module">
  import {mount} from "./source/custom.js";
  import {sample, check} from "./source/fixture.mjs";
  import {verify} from "./source/verify.mjs";
  async function main() {
    if (new URL(location.href).searchParams.has("verify")) {
      await verify(mount, sample, check);
      document.querySelector("#verification").textContent = "PASS · fixture, switching, retry, page lifecycle and cleanup checks.";
    } else {
      mount({getActiveSessionId: () => "preview", onSessionChanged: () => () => {}, request: async () => sample()});
    }
    document.querySelector(".example-reasoning-display").open = true;
  }
  main().catch(error => { document.querySelector("#verification").textContent = "FAIL · " + error.message; });
</script>
</html>
